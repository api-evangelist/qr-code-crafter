deprecated_operations: []
availability_semantics:
  - status: 503
    meaning: >-
      Dynamic QR or vault storage unavailable, or the 100,000 active-record hard capacity reached. The
      spec states no record was changed / deletion was not confirmed, making retry safe.
    operations: [createDynamicQr, getDynamicQr, updateDynamicQr, deleteDynamicQr, createDynamicQrVault, getDynamicQrVaultChildAnalytics, redirectDynamicQr]
  - status: 410
    meaning: A dynamic QR destination is owner-paused or operator-blocked — the printed code still resolves, but to a gone state.
    operations: [redirectDynamicQr]
  - status: 423
    meaning: Operator-blocked record; the capability holder cannot update or resume it.
    operations: [updateDynamicQr]
data_retention:
  dynamic_qr_analytics_days: 90
  note: >-
    Aggregate daily count buckets only. The provider enumerates what it does NOT store — IP addresses,
    user agents, referrers, cookies, locations, device data, browser data, unique visitor identifiers,
    destinations, management tokens.
