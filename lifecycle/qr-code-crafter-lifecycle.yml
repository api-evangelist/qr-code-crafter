status_page_note: >-
  /status returns 404 and no third-party status page (statuspage.io, instatus, betteruptime) is linked
  from the site, ai.txt, llms.txt or the provider's own apis.json. The service runs on Netlify and
  degrades through documented 503 responses on the storage-backed operations rather than through a
  published status surface.
