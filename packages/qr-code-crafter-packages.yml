note: >-
  QR Code Crafter ships NO first-party client library in any language. This was checked, not assumed.
  Neither llms.txt nor ai.txt nor the provider's own apis.json lists an SDK, a client library, a
  GitHub organization or a source repository — the published integration surface is the raw HTTP
  contract, the WebMCP browser tools, and copy-paste recipes on /qr-code-api. Given a 19-operation
  API with no auth on the generation path, that is a defensible choice rather than an obvious gap,
  but it does mean an integrator writes their own HTTP client.
