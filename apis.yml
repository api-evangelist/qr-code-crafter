name: QR Code Crafter
description: >-
  Public QR code generation API by Brand Aspect Ltd (England & Wales, company 05105266) supporting 27 payload types —
  URL, GS1 Digital Link, Wi-Fi, vCard, event, location, crypto and fifteen payment schemes including PIX, UPI,
  PromptPay, VietQR, Swiss QR-bill and SEPA/GiroCode — exported as SVG, PNG, JPG, WebP, PDF or EPS at up to 4096px.
  Adds bounded bulk ZIP generation (50 rows with a manifest), a generate-and-verify endpoint that decodes the finished
  asset and returns an evidence receipt, and capability-managed dynamic URL redirects and vaults with privacy-preserving
  aggregate counts and no accounts or visitor tracking. Unusually agent-native for its size: it self-publishes an
  APIs.json index, OpenAPI 3.0.1 in both JSON and YAML, an ai-plugin manifest, a WebMCP browser-agent context with eight
  tool schemas, llms.txt, ai.txt, an Atom change feed for agents, and Markdown variants of every public page.
