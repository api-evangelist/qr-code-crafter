test_live_separation:
  modes: none
  key_prefixes: none
  note: >-
    There is NO separate sandbox environment and no test-vs-live key split, because there is nothing to
    separate: generation is free, unauthenticated, stateless and non-billable, so production IS the test
    environment. The one place where a mistake is expensive — creating a dynamic redirect — has no test
    mode either, and a created record counts against the 100,000 active-record capacity. An agent
    rehearsing a dynamic-QR flow should expect to create and then delete real records.
console:
  available: true
  kind: interactive-generator-forms
  urls:
    - https://qrcodecrafter.com/url
    - https://qrcodecrafter.com/bulk-qr-code-generator
    - https://qrcodecrafter.com/dynamic-qr-code
    - https://qrcodecrafter.com/qr-code-readability-lab
  note: >-
    The visible generator forms are a genuine playground for the API's own operations — each is a
    server-rendered form[toolname=...] wired to the same endpoint an HTTP client calls, so a developer
    can exercise generateQr, generateBulkQr, generateVerifiedQr and createDynamicQr in a browser with no
    account and no key. The Readability Lab hosts the distinctive visible generate_verified_qr workflow.
    This is a product UI doing double duty as an API console, not a dedicated developer console.
fixtures:
  available: true
  name: QR Code Readability Benchmark v1
  count: 21
  published: '2026-07-22'
  description: >-
    Controlled PNG, JPG, WebP and rendered-SVG export fixtures with exact-decode results — the closest
