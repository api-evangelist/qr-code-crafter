test_values:
  note: >-
    No magic test identifiers exist — there are no test cards, test IBANs or reserved numbers, because
    the API never contacts a payment scheme. It produces a QR ASSET from a payload string; the payload
    is never transacted. The provider's published agent recipes double as safe example payloads and are
    captured verbatim in examples/qr-code-crafter-agent-recipes.yml (27 of them, one per payload type,
    all using example.com / documentation-range values).
  see: examples/qr-code-crafter-agent-recipes.yml
tooling:
  - name: live smoke test
    kind: provider-operated
    description: >-
      Fetches the deployed OpenAPI/WebMCP discovery files, builds payloads from the published agent
      recipes, and exercises all 27 payload types across all six formats — verifying status codes,
      content type or file signature, decoded byte length, response metadata and rendered dimensions.
      For SVG, PNG, JPG and WebP it rasterizes and decodes with jsQR to confirm the scanned payload
      matches the requested value.
    note: Described in ai.txt; the runner itself is not published.
  - name: 'npm run test:local-webmcp'
    kind: provider-operated
    description: Validates production-build WebMCP discovery locally before live Netlify checks.
    note: Referenced in llms.txt; the script lives in a repository that is not publicly linked.
toggles:
  - name: '?webmcp=on'
    description: Forces the Chrome WebMCP Origin-Trial header for testing agentic browsing.
  - name: '?webmcp=off'
    description: Omits the trial header while retaining declarative forms, schemas, manifests and API access.
  - name: 'Accept: text/markdown'
    description: >-
      Returns any public content page as stripped Markdown with X-Markdown-Tokens and a Content-Signal
      header — verified live on the pricing and API docs pages.
