  note: >-
    QR Code Crafter publishes a pricing page but sells nothing on it. There is no paid tier, no
    subscription, no metered billing, no account and no card capture anywhere on the site — the page
    exists to explain the free public API's limits and to tell a reader when they should go buy a
    paid dynamic-QR platform instead. plan_count is 1 because there is exactly one real offer (free
    public access), not because a paid tier was hidden behind a sales gate.
