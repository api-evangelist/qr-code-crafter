    evidence: DynamicQrVaultChildRecord = DynamicQrRecord + DynamicQrVaultChildMetadata
  - from: DynamicQrVaultChildRecord
    to: DynamicQrVaultChildMetadata
    type: has_one
    via: allOf
  - from: DynamicQrVaultChildRecord
    to: DynamicQrAnalyticsSummary
    type: has_one
    via: analytics
    evidence: getDynamicQrVaultChildAnalytics returns DynamicQrVaultChildAnalyticsResponse
  - from: DynamicQrRecord
    to: DynamicQrAnalyticsSummary
    type: has_one
    via: analytics
    evidence: DynamicQrManageResponse.analytics — property omitted when analytics are disabled
  - from: QrVerificationReceipt
    to: QrSafePayloadReview
    type: has_one
    via: payload
  - from: QrVerificationReceipt
